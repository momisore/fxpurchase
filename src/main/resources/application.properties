spring.application.name=fxpurchase
spring.profiles.default=local

# Treasury API config
treasury.api.base-url=${TREASURY_API_BASE_URL:https://api.fiscaldata.treasury.gov/services/api/fiscal_service}
treasury.api.connect-timeout-ms=${TREASURY_API_CONNECT_TIMEOUT_MS:3000}
treasury.api.read-timeout-ms=${TREASURY_API_READ_TIMEOUT_MS:5000}
treasury.api.max-retries=${TREASURY_API_MAX_RETRIES:2}
treasury.api.retry-backoff-ms=${TREASURY_API_RETRY_BACKOFF_MS:250}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Include correlation id from MDC in logs
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId}] %logger{36} - %msg%n